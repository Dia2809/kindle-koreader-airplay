name: Kindle Touch Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq help2man bzip2 xz-utils pkg-config nasm yasm cmake autoconf automake libtool libtool-bin python3 flex gperf texinfo binutils
          sudo mv /usr/bin/makeinfo /usr/bin/makeinfo.real 2>/dev/null || true
          sudo rm -f /usr/bin/makeinfo
          echo '#!/bin/bash' | sudo tee /usr/bin/makeinfo > /dev/null
          echo 'exit 0' | sudo tee -a /usr/bin/makeinfo > /dev/null
          sudo chmod +x /usr/bin/makeinfo

      - name: Cache toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: /home/runner/x-tools
          key: tc-kindle5-v4

      - name: Build koxtoolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        env:
          CT_PREFIX: /home/runner/x-tools
        run: |
          git clone https://github.com/koreader/koxtoolchain.git /tmp/koxtoolchain
          cd /tmp/koxtoolchain
          ./gen-tc.sh kindle5

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: /opt
          key: kindle5-deps-v1

      - name: Build OpenSSL
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PATH="/home/runner/x-tools/arm-kindle5-linux-gnueabi/bin:$PATH"
          wget -q https://www.openssl.org/source/openssl-1.1.1w.tar.gz
          tar xf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          ./Configure linux-armv4 --cross-compile-prefix=arm-kindle5-linux-gnueabi- --prefix=/opt/openssl-arm no-shared no-tests -march=armv7-a -mfloat-abi=softfp -mfpu=neon -fPIC
          make -j$(nproc) && make install_sw

      - name: Build libplist
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PATH="/home/runner/x-tools/arm-kindle5-linux-gnueabi/bin:$PATH"
          wget -q https://github.com/libimobiledevice/libplist/releases/download/2.3.0/libplist-2.3.0.tar.bz2
          tar xf libplist-2.3.0.tar.bz2
          cd libplist-2.3.0
          ./configure --host=arm-kindle5-linux-gnueabi --prefix=/opt/plist-arm --enable-static --disable-shared --without-cython CC=arm-kindle5-linux-gnueabi-gcc CXX=arm-kindle5-linux-gnueabi-g++ [...]
          make -j$(nproc) && make install

      - name: Build ffmpeg
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PATH="/home/runner/x-tools/arm-kindle5-linux-gnueabi/bin:$PATH"
          wget -q https://ffmpeg.org/releases/ffmpeg-4.4.4.tar.xz
          tar xf ffmpeg-4.4.4.tar.xz
          cd ffmpeg-4.4.4
          ./configure --cross-prefix=arm-kindle5-linux-gnueabi- --target-os=linux --arch=arm --cpu=armv7-a --enable-cross-compile --enable-static --disable-shared --disable-everything --enable-dec[...]
          make -j$(nproc) && make install

      - name: Build plugin
        run: |
          export PATH="/home/runner/x-tools/arm-kindle5-linux-gnueabi/bin:$PATH"
          make TARGET=sf build-kindle-sf/libairplay_mirror.so CC_KINDLE=arm-kindle5-linux-gnueabi-gcc STRIP_K=arm-kindle5-linux-gnueabi-strip FF_CFLAGS='-I/opt/ffmpeg-arm/include' FF_LDFLAGS='/opt[...]

      - name: Package
        run: |
          make _assemble SO=build-kindle-sf/libairplay_mirror.so TARGET=sf
          cd dist-sf && zip -r ../airplay.koplugin-sf.zip airplay.koplugin/ && cd ..

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: airplay.koplugin-sf.zip
