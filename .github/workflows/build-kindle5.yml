name: Build for Kindle Touch (GLIBC 2.12)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (kindle5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq help2man bzip2 xz-utils pkg-config nasm yasm cmake autoconf automake libtool libtool-bin python3 flex gperf texinfo

      # Cache koxtoolchain (takes ~30 min to build)
      - name: Cache koxtoolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: /tmp/koxtoolchain
          key: koxtoolchain-kindle5-${{ hashFiles('**/x-compile.sh') }}

      - name: Clone koxtoolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/koreader/koxtoolchain.git /tmp/koxtoolchain

      - name: Build koxtoolchain (kindle5)
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          cd /tmp/koxtoolchain
          ./gen-tc.sh kindle5
        env:
          CT_PREFIX: /tmp/koxtoolchain/build

      - name: Set up environment
        run: |
          source /tmp/koxtoolchain/refs/x-compile.sh kindle5 env
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "CC=$CC" >> $GITHUB_ENV
          echo "SYSROOT=$SYSROOT" >> $GITHUB_ENV

      # Cache built dependencies (OpenSSL, libplist, ffmpeg)
      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            /opt/openssl-arm
            /opt/plist-arm
            /opt/ffmpeg-arm
          key: kindle5-deps-${{ hashFiles('**/Makefile') }}

      # Build ARM static OpenSSL 1.1.1 with koxtoolchain
      - name: Build OpenSSL (ARM soft-float)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          source /tmp/koxtoolchain/refs/x-compile.sh kindle5 env
          wget -q https://www.openssl.org/source/openssl-1.1.1w.tar.gz
          tar xf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          ./Configure linux-armv4 \
              --cross-compile-prefix=arm-kindle5-linux-gnueabi- \
              --prefix=/opt/openssl-arm \
              no-shared no-tests \
              -march=armv7-a -mfloat-abi=softfp -mfpu=neon -fPIC
          make -j$(nproc)
          make install_sw
          cd .. && rm -rf openssl-1.1.1w openssl-1.1.1w.tar.gz

      # Build ARM static libplist with koxtoolchain
      - name: Build libplist (ARM soft-float)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          source /tmp/koxtoolchain/refs/x-compile.sh kindle5 env
          wget -q https://github.com/libimobiledevice/libplist/releases/download/2.3.0/libplist-2.3.0.tar.bz2
          tar xf libplist-2.3.0.tar.bz2
          cd libplist-2.3.0
          ./configure \
              --host=arm-kindle5-linux-gnueabi \
              --prefix=/opt/plist-arm \
              --enable-static \
              --disable-shared \
              --without-cython \
              CC=arm-kindle5-linux-gnueabi-gcc \
              CXX=arm-kindle5-linux-gnueabi-g++ \
              CFLAGS="-march=armv7-a -mfloat-abi=softfp -mfpu=neon -fPIC" \
              CXXFLAGS="-march=armv7-a -mfloat-abi=softfp -mfpu=neon -fPIC"
          make -j$(nproc)
          make install
          cd .. && rm -rf libplist-2.3.0 libplist-2.3.0.tar.bz2

      # Build minimal ARM static ffmpeg with koxtoolchain
      - name: Build ffmpeg (ARM soft-float)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          source /tmp/koxtoolchain/refs/x-compile.sh kindle5 env
          wget -q https://ffmpeg.org/releases/ffmpeg-4.4.4.tar.xz
          tar xf ffmpeg-4.4.4.tar.xz
          cd ffmpeg-4.4.4
          ./configure \
              --cross-prefix=arm-kindle5-linux-gnueabi- \
              --target-os=linux \
              --arch=arm \
              --cpu=armv7-a \
              --enable-cross-compile \
              --enable-static \
              --disable-shared \
              --disable-everything \
              --enable-decoder=h264 \
              --enable-avcodec \
              --enable-avutil \
              --enable-swscale \
              --disable-avformat \
              --disable-avdevice \
              --disable-avfilter \
              --disable-swresample \
              --disable-postproc \
              --disable-doc \
              --disable-programs \
              --disable-network \
              --enable-pic \
              --extra-cflags="-march=armv7-a -mfloat-abi=softfp -mfpu=neon -fPIC" \
              --prefix=/opt/ffmpeg-arm \
              --quiet
          make -j$(nproc)
          make install
          cd .. && rm -rf ffmpeg-4.4.4 ffmpeg-4.4.4.tar.xz

      - name: Build libairplay_mirror.so
        run: |
          source /tmp/koxtoolchain/refs/x-compile.sh kindle5 env
          make TARGET=sf build-kindle-sf/libairplay_mirror.so \
            CC_KINDLE=arm-kindle5-linux-gnueabi-gcc \
            STRIP_K=arm-kindle5-linux-gnueabi-strip \
            FF_CFLAGS='-I/opt/ffmpeg-arm/include' \
            FF_LDFLAGS='/opt/ffmpeg-arm/lib/libavcodec.a /opt/ffmpeg-arm/lib/libswscale.a /opt/ffmpeg-arm/lib/libavutil.a -lm' \
            OPENSSL_CFLAGS='-I/opt/openssl-arm/include' \
            OPENSSL_LDFLAGS='/opt/openssl-arm/lib/libssl.a /opt/openssl-arm/lib/libcrypto.a' \
            PLIST_CFLAGS='-I/opt/plist-arm/include' \
            PLIST_LDFLAGS='/opt/plist-arm/lib/libplist-2.0.a'

      - name: Assemble plugin
        run: |
          make _assemble SO=build-kindle-sf/libairplay_mirror.so TARGET=sf

      - name: Package
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="manual-$(date +%Y%m%d-%H%M%S)"
          fi
          cd dist-sf
          zip -r "../airplay.koplugin-sf-kindle5-${VERSION}.zip" airplay.koplugin/
          cd ..
          sha256sum "airplay.koplugin-sf-kindle5-${VERSION}.zip" \
            > "airplay.koplugin-sf-kindle5-${VERSION}.zip.sha256"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            airplay.koplugin-sf-kindle5-${{ env.VERSION }}.zip
            airplay.koplugin-sf-kindle5-${{ env.VERSION }}.zip.sha256
          body: |
            ## Install

            1. Download `airplay.koplugin-sf-kindle5-${{ env.VERSION }}.zip`
            2. Unzip and copy `airplay.koplugin/` to your Kindle:
               ```
               cp -r airplay.koplugin /Volumes/Kindle/extensions/koreader/plugins/
               ```
            3. Restart KOReader

            **Note:** This build is specifically for Kindle Touch (GLIBC 2.12). It should work on all Kindle devices with firmware <= 5.16.2.1.1.
